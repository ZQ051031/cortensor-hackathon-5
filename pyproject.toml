[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-research-brief"
version = "0.1.0"
description = "A source-grounded research brief CLI built with OpenMinion"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "openminion==0.1.24",
    "beautifulsoup4>=4.12,<5",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
research-brief = "research_brief.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
